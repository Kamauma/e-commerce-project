{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Products</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            margin: 40px auto; /* center container */
            gap: 10px; /* space between boxes */
        }

        .category-box {
            flex: 1; /* both boxes take equal width */
            height: 70vh; /* taller boxes */
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .category-box:hover {
            transform: translateY(-5px);
            box-shadow: 0px 8px 18px rgba(0, 0, 0, 0.2);
        }

        .category-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(65%);
        }

        .category-title {
            position: absolute;
            color: white;
            font-size: 3rem;
            font-weight: bold;
            bottom: 20px;
            left: 20px;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.7);
        }

        a {
            text-decoration: none;
            flex: 1;
        }

        /* Responsive: stack vertically on small screens */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .category-box {
                height: 50vh;
            }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- Phones Category -->
    <a href="#">
        <div class="category-box">
            <img src="{% static 'accounts/products/phones/phones.png' %}" alt="Phones">
            <div class="category-title">Shop Phones</div>
        </div>
    </a>

    <!-- Home Appliances Category -->
    <a href="#">
        <div class="category-box">
            <img src="{% static 'accounts/products/homeappliances/hsetech.png' %}" alt="Home Appliances">
            <div class="category-title">Shop Home Appliances</div>
        </div>
    </a>

</div>
</body>
</html>
